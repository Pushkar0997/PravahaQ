[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pravaha-q"
version = "0.1.0"
description = "Hybrid HPC-Quantum Optimization Engine for Coupled Edge-AI Routing & 3-Phase Microgrid Thermal Dispatch (HUBO, BF-DCQO, PCE, IQO-BnB)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Pushkar Kumar", email = "pushkar@pravahaq.io" }
]
keywords = [
    "quantum-computing",
    "quantum-optimization",
    "hubo",
    "ising-spin-glass",
    "counterdiabatic-driving",
    "bf-dcqo",
    "pauli-correlation-encoding",
    "qiskit",
    "pennylane",
    "cirq",
    "tensor-networks",
    "edge-ai",
    "microgrid"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
]

[project.optional-dependencies]
quantum = [
    "qiskit>=1.2.0",
    "qiskit-ibm-runtime>=0.29.0",
    "pennylane>=0.38.0",
    "cirq-core>=1.4.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.98.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
pravaha-q = "pravaha_q.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
