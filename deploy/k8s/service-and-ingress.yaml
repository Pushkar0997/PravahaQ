# ============================================================================
# PravahaQ v0.1.0 — Kubernetes Service, HPA Autoscaler & TLS Ingress
# Apply with: kubectl apply -f deploy/k8s/service-and-ingress.yaml
# ============================================================================

apiVersion: v1
kind: Service
metadata:
  name: pravaha-q-service
  labels:
    app.kubernetes.io/name: pravaha-q
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/version: "0.1.0"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pravaha-q
    app.kubernetes.io/component: control-plane
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http-api
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pravaha-q-control-plane-hpa
  labels:
    app.kubernetes.io/name: pravaha-q
    app.kubernetes.io/version: "0.1.0"
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pravaha-q-control-plane
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pravaha-q-ingress
  labels:
    app.kubernetes.io/name: pravaha-q
    app.kubernetes.io/version: "0.1.0"
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - api.pravahaq.io
      secretName: pravaha-q-tls-secret
  rules:
    - host: api.pravahaq.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pravaha-q-service
                port:
                  number: 80
