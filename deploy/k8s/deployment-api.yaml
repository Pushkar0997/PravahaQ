# ============================================================================
# PravahaQ v0.1.0 — Kubernetes Production Deployment & ConfigMap
# Apply with: kubectl apply -f deploy/k8s/deployment-api.yaml
# ============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: pravaha-q-engine-config
  labels:
    app.kubernetes.io/name: pravaha-q
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/version: "0.1.0"
data:
  PRAVAHA_ENV: "production"
  PRAVAHA_DEFAULT_ALGORITHM: "bf_dcqo"
  PRAVAHA_DEFAULT_SDK: "qiskit"
  PRAVAHA_RANDOM_SEED: "42"
  PRAVAHA_SLA_TIMEOUT_MS: "450"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pravaha-q-control-plane
  labels:
    app.kubernetes.io/name: pravaha-q
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: pravaha-q
      app.kubernetes.io/component: control-plane
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pravaha-q
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/version: "0.1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/v1/metrics"
    spec:
      containers:
        - name: pravaha-q-api
          image: ghcr.io/pushkar0997/pravaha-q-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pravaha-q-engine-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http-api
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
