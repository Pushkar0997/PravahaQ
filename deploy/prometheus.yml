# ============================================================================
# PravahaQ v0.1.0 — Prometheus Quantum Telemetry Scraping Configuration
# Scrapes solver latency, Approximation Ratio (AR), job counters, and
# post-quantum feasibility repair metrics from /api/v1/metrics
# ============================================================================

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: "pravaha-q"
    version: "0.1.0"
    compiler: "Vaisheshika-3Local"

scrape_configs:
  - job_name: "pravaha-q-control-plane"
    metrics_path: "/api/v1/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "pravaha-api:8000"
          - "host.docker.internal:8000"
        labels:
          service: "pravaha-q-api"
          tier: "quantum-classical-control-plane"
